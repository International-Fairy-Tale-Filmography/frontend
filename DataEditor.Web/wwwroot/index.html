<head>
    <meta charset="utf-8" />

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        window.dataEditorDrafts = {
            open: function () {
                return new Promise(function (resolve, reject) {
                    var request = indexedDB.open('iftf-data-editor', 1);
                    request.onupgradeneeded = function () {
                        request.result.createObjectStore('drafts');
                    };
                    request.onsuccess = function () { resolve(request.result); };
                    request.onerror = function () { reject(request.error); };
                });
            },
            key: function (owner, repository, branch) {
                var tabId = sessionStorage.getItem('iftf-data-editor-tab');
                if (!tabId) {
                    tabId = crypto.randomUUID();
                    sessionStorage.setItem('iftf-data-editor-tab', tabId);
                }
                return owner + '/' + repository + '/' + branch + '/' + tabId;
            },
            get: async function (key) {
                var db = await this.open();
                return new Promise(function (resolve, reject) {
                    var request = db.transaction('drafts', 'readonly').objectStore('drafts').get(key);
                    request.onsuccess = function () { resolve(request.result || null); };
                    request.onerror = function () { reject(request.error); };
                });
            },
            set: async function (key, value) {
                var db = await this.open();
                return new Promise(function (resolve, reject) {
                    var transaction = db.transaction('drafts', 'readwrite');
                    transaction.objectStore('drafts').put(value, key);
                    transaction.oncomplete = function () { resolve(); };
                    transaction.onerror = function () { reject(transaction.error); };
                    transaction.onabort = function () { reject(transaction.error); };
                });
            },
            remove: async function (key) {
                var db = await this.open();
                return new Promise(function (resolve, reject) {
                    var transaction = db.transaction('drafts', 'readwrite');
                    transaction.objectStore('drafts').delete(key);
                    transaction.oncomplete = function () { resolve(); };
                    transaction.onerror = function () { reject(transaction.error); };
                    transaction.onabort = function () { reject(transaction.error); };
                });
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
